# ArgoCD Application for the monitoring stack (monitoring namespace).
# Uses the local chart committed in this repo. Manual sync.
# Apply after charts/monitoring is pushed:
#   kubectl apply -f k8s/argocd/monitoring.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/JakeConal/ticket-box.git
    targetRevision: master
    path: charts/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
