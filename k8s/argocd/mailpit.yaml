# ArgoCD Application for Mailpit (mailpit namespace).
# Uses the local chart committed in this repo. Manual sync.
# Apply after charts/mailpit is pushed:
#   kubectl apply -f k8s/argocd/mailpit.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mailpit
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/JakeConal/ticket-box.git
    targetRevision: main
    path: charts/mailpit
  destination:
    server: https://kubernetes.default.svc
    namespace: mailpit
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
