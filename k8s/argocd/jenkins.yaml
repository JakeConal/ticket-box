# ArgoCD Application for Jenkins (jenkins namespace).
# Multi-source: the upstream Helm chart plus values committed in this repo.
# Manual sync: ArgoCD renders and compares but never changes the cluster
# until a sync is triggered. Apply after charts/jenkins-values.yaml is pushed:
#   kubectl apply -f k8s/argocd/jenkins.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jenkins
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://charts.jenkins.io
      chart: jenkins
      targetRevision: 5.9.54
      helm:
        releaseName: jenkins
        valueFiles:
          - $values/charts/jenkins-values.yaml
    - repoURL: https://github.com/JakeConal/ticket-box.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: jenkins
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
