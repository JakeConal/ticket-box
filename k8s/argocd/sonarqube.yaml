# ArgoCD Application for SonarQube (sonarqube namespace).
# Multi-source: the upstream Helm chart plus values committed in this repo.
# Manual sync. Apply after charts/sonarqube-values.yaml is pushed:
#   kubectl apply -f k8s/argocd/sonarqube.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sonarqube
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://SonarSource.github.io/helm-chart-sonarqube
      chart: sonarqube
      targetRevision: 2026.4.1
      helm:
        releaseName: sonarqube
        valueFiles:
          - $values/charts/sonarqube-values.yaml
    - repoURL: https://github.com/JakeConal/ticket-box.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: sonarqube
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
