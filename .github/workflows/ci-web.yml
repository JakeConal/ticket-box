name: CI - Web

on:
  push:
    branches: ["**"]
    paths:
      - "ticketbox-web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ci-web.yml"
  pull_request:
    paths:
      - "ticketbox-web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ci-web.yml"

env:
  IMAGE_NAME: ticketbox-web

jobs:
  test-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --filter ticketbox-web... --frozen-lockfile

      - name: Type check
        run: pnpm --filter ticketbox-web exec tsc --noEmit

      - name: Run tests with coverage
        run: pnpm --filter ticketbox-web test:coverage

      - name: SonarCloud analysis
        if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'
        uses: sonarsource/sonarqube-scan-action@v6
        with:
          projectBaseDir: ticketbox-web
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-and-publish:
    needs: test-and-analyze
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value={{branch}}-{{sha}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ticketbox-web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
