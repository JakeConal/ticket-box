{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ticketbox-app
  labels:
    app.kubernetes.io/part-of: ticketbox-app
  annotations:
    # ingress-nginx proxies Upgrade/Connection headers for WebSocket
    # connections automatically; proxy-http-version pins the origin
    # connection to HTTP/1.1 so the upgrade handshake works.
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: {{ .Values.api.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: {{ .Values.web.port }}
{{- end }}
