apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: api-imports
  labels:
    app.kubernetes.io/part-of: ticketbox-app
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.api.storage.importsSize }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: api-storage
  labels:
    app.kubernetes.io/part-of: ticketbox-app
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.api.storage.storageSize }}
