apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-ticketbox-overview
  labels:
    app.kubernetes.io/name: grafana
data:
  ticketbox-overview.json: |
    {
      "title": "TicketBox Overview",
      "uid": "ticketbox-overview",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Pod Restarts",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "expr": "sum by (namespace, pod) (kube_pod_container_status_restarts_total{namespace=~\"ticketbox|mailpit\"})",
              "legendFormat": "{{`{{namespace}}/{{pod}}`}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "Deployment Ready Replicas",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "expr": "kube_deployment_status_replicas_ready{namespace=~\"ticketbox|mailpit\"}",
              "legendFormat": "{{`{{namespace}}/{{deployment}}`}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "Container CPU Usage",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"ticketbox\"}[5m]))",
              "legendFormat": "{{`{{pod}}`}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "title": "Container Memory Usage",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"ticketbox\"})",
              "legendFormat": "{{`{{pod}}`}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "title": "Api Request Rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "expr": "sum by (uri, status) (rate(http_server_requests_seconds_count{job=\"api\"}[5m]))",
              "legendFormat": "{{`{{uri}} ({{status}})`}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "title": "Api Request Latency (p95)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, uri) (rate(http_server_requests_seconds_bucket{job=\"api\"}[5m])))",
              "legendFormat": "{{`{{uri}}`}}",
              "refId": "A"
            }
          ]
        }
      ]
    }
