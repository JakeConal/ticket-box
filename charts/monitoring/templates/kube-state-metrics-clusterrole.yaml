apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics
  labels:
    app.kubernetes.io/name: kube-state-metrics
rules:
  # Scoped to only the resources this project's dashboards need (pod
  # restarts, resource usage, deployment/replica status) - see design.md's
  # "kube-state-metrics is still required, and still needs a ClusterRole"
  # decision. Not the full upstream default set (which also includes
  # secrets, configmaps, and many other resource types this project
  # doesn't use).
  - apiGroups:
      - ""
    resources:
      - pods
      - nodes
    verbs:
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments
      - replicasets
    verbs:
      - list
      - watch
