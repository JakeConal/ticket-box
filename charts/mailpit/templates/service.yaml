apiVersion: v1
kind: Service
metadata:
  name: mailpit
  labels:
    app.kubernetes.io/name: mailpit
spec:
  selector:
    app.kubernetes.io/name: mailpit
  ports:
    - name: smtp
      port: {{ .Values.smtpPort }}
      targetPort: smtp
    - name: web
      port: {{ .Values.webPort }}
      targetPort: web
