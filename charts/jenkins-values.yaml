# Values for the official jenkins/jenkins chart, installed into the jenkins
# namespace (Phase 2 of docs/kubernetes-migration-plan.md).
# Install:
#   helm upgrade --install jenkins jenkins/jenkins -n jenkins -f charts/jenkins-values.yaml

controller:
  # Admin password is generated by the chart and stored in the "jenkins"
  # secret; retrieve it with:
  #   kubectl -n jenkins get secret jenkins -o jsonpath="{.data.jenkins-admin-password}" | base64 -d
  serviceType: ClusterIP
  ingress:
    enabled: true
    hostName: jenkins.ticketbox.local
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi

persistence:
  enabled: true
  size: 8Gi

agent:
  enabled: true
  # Bounded concurrency: builds are heavy; keep agent pods limited.
  containerCap: 2
