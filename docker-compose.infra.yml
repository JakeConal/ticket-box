name: ticketbox-infra

services:
  jenkins:
    build:
      context: ./infra/jenkins
    container_name: ticketbox-jenkins
    restart: unless-stopped
    user: root
    ports:
      - "${JENKINS_HTTP_PORT:-8081}:8080"
      - "${JENKINS_AGENT_PORT:-50000}:50000"
    environment:
      JENKINS_OPTS: "--prefix=/"
      TICKETBOX_APP_COMPOSE_PROJECT: "${TICKETBOX_APP_COMPOSE_PROJECT:-ticketbox}"
    volumes:
      - jenkins-home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - infra

  mailpit:
    image: axllent/mailpit:v1.22
    container_name: ticketbox-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_WEB_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    networks:
      - ticketbox
      - infra

  ngrok:
    image: ngrok/ngrok:latest
    container_name: ticketbox-ngrok
    restart: unless-stopped
    profiles:
      - tunnel
    command:
      - http
      - jenkins:8080
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    depends_on:
      - jenkins
    ports:
      - "${NGROK_INSPECT_PORT:-4040}:4040"
    networks:
      - infra

  # Future observability services can live in this same stack, for example:
  # prometheus:
  # grafana:
  # loki:
  # promtail:

volumes:
  jenkins-home:

networks:
  infra:
    name: ticketbox-infra
  ticketbox:
    name: ticketbox
